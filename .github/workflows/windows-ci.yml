name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Kombos.Tests/Kombos.Tests.csproj -c Release -m:1
      - name: Tests
        run: dotnet test Kombos.Tests/Kombos.Tests.csproj -c Release --no-build -m:1
